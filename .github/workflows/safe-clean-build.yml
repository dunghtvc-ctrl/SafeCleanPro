name: Build SafeClean Pro EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Restore embedded source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src | Out-Null
          [IO.File]::WriteAllBytes("src/SafeCleanPro.csproj", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("src/app.manifest", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("src/Program.cs", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("src/Models.cs", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("src/CleanerEngine.cs", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("src/MainForm.cs", [Convert]::FromBase64String(""))
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build portable Windows EXE
        shell: pwsh
        run: dotnet publish src/SafeCleanPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o release
      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path release/SafeCleanPro.exe)) { throw "SafeCleanPro.exe was not created" }
          Get-FileHash release/SafeCleanPro.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: SafeCleanPro-win-x64
          path: release/SafeCleanPro.exe
          if-no-files-found: error
